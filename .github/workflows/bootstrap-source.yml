name: Bootstrap v0.7.1 source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check for bootstrap payload
        id: bootstrap
        shell: bash
        run: |
          if [ -f .bootstrap/xz-00.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and expand verified source
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/xz-00.b64 \
            .bootstrap/xz-01.b64 \
            .bootstrap/fix-02a.b64 .bootstrap/fix-02b.b64 .bootstrap/fix-02c.b64 .bootstrap/fix-02d.b64 \
            .bootstrap/xz-03.b64 .bootstrap/xz-04.b64 .bootstrap/xz-05.b64 .bootstrap/xz-06.b64 \
            .bootstrap/fix-07a.b64 .bootstrap/fix-07b.b64 .bootstrap/fix-07c.b64 .bootstrap/fix-07d.b64 \
            .bootstrap/xz-08.b64 .bootstrap/xz-09.b64 \
            .bootstrap/fix-10a.b64 .bootstrap/fix-10b.b64 .bootstrap/fix-10c.b64 .bootstrap/fix-10d.b64 \
            .bootstrap/xz-11.b64 \
            | tr -d '\n\r ' | base64 -d > /tmp/source.tar.xz
          echo "dbbaa8e25346b13c3558a193699f4bd0bda6e2e75ea26b904c5bcba43eda1d08  /tmp/source.tar.xz" | sha256sum -c -
          mkdir -p /tmp/import
          tar -xJf /tmp/source.tar.xz -C /tmp/import
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-source.yml' \
            /tmp/import/home-health-platform/ ./
          rm -rf .bootstrap

      - name: Commit expanded source
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import v0.7.1 Vercel-verified source [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
