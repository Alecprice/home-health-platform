services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homehealth_admin
      POSTGRES_PASSWORD: homehealth_admin
      POSTGRES_DB: homehealth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - homehealth_pgdata_v04:/var/lib/postgresql/data
      - ./database/bootstrap/000_local_app_role.sql:/docker-entrypoint-initdb.d/000_local_app_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehealth_admin -d homehealth"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  homehealth_pgdata_v04:
